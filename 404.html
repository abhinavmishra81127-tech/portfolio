<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050608">
<title>Page not found | Abhinav Mishra</title>
<style>
@font-face{font-family:Anton;src:url(/portfolio/assets/fonts/anton.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Inter Tight";src:url(/portfolio/assets/fonts/inter-tight.woff2) format("woff2");font-weight:100 900;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:grid;place-items:center;padding:24px;background:#050608;color:#c3c7cf;font:400 18px/1.5 "Inter Tight",system-ui,sans-serif;text-align:center}
.code{font:400 clamp(110px,22vw,240px)/.9 Anton,Impact,sans-serif;color:#e5233b;margin:0}
h1{font:400 clamp(28px,4vw,44px)/1.1 Anton,Impact,sans-serif;text-transform:uppercase;color:#f2f3f5;margin:12px 0 10px}
p{margin:0 0 28px;max-width:420px}
a{display:inline-block;padding:14px 26px;border-radius:999px;background:#d01a2f;color:#fff;font-weight:600;text-decoration:none;transition:background .2s}
a:hover,a:focus-visible{background:#e5233b}
a:focus-visible{outline:2px solid #f2f3f5;outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true">404</p>
  <h1>Page not found</h1>
  <p>This page doesn't exist or has moved. The portfolio is one click away.</p>
  <a href="/portfolio/">Back to portfolio</a>
</main>
</body>
</html>
